<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Linkly URL Shortener and QR Generator Preview">
  <defs>
    <linearGradient id="linkly-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="linkly-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#linkly-bg)"/>

  <!-- Main Card Container -->
  <rect x="48" y="28" width="544" height="344" rx="16" fill="#132232" stroke="rgba(240,244,247,0.12)" stroke-width="1"/>

  <text x="80" y="68" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="700" fill="#f0f4f7">Linkly <tspan fill="#34d399">Shortener</tspan></text>
  <text x="80" y="88" font-family="'Geist Sans',sans-serif" font-size="11" fill="#94a3b8">Fast URL shortening, custom slugs, and instant high-res QR codes.</text>

  <!-- Input Field Group -->
  <g transform="translate(80, 108)">
    <rect width="360" height="46" rx="10" fill="#0b1117" stroke="rgba(52,211,153,0.4)"/>
    <text x="16" y="27" font-family="'Geist Sans',sans-serif" font-size="11" fill="#94a3b8">https://example.com/very-long-research-dataset-url...</text>
    <rect x="372" y="0" width="108" height="46" rx="10" fill="url(#linkly-accent)"/>
    <text x="408" y="28" font-family="'Geist Sans',sans-serif" font-size="12" font-weight="700" fill="#0b1117">Shorten</text>
  </g>

  <!-- Output Result Panel -->
  <g transform="translate(80, 175)">
    <rect width="480" height="150" rx="12" fill="#0b1117" stroke="rgba(240,244,247,0.14)"/>

    <!-- Left short link info -->
    <g transform="translate(24, 24)">
      <text font-family="'Geist Mono',monospace" font-size="10" font-weight="700" fill="#34d399">GENERATED LINK</text>
      <text y="28" font-family="'Space Grotesk',sans-serif" font-size="18" font-weight="700" fill="#f0f4f7">lnk.ly/data-2026</text>
      
      <rect y="44" width="130" height="28" rx="6" fill="#1e2f42"/>
      <text x="14" y="62" font-family="'Geist Sans',sans-serif" font-size="10" font-weight="600" fill="#34d399">✓ Copied to clipboard</text>

      <text y="92" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">Redirects: 1,420 · Serverless Vercel</text>
    </g>

    <!-- Right QR Code Mockup -->
    <g transform="translate(350, 20)">
      <rect width="100" height="100" rx="8" fill="#ffffff"/>
      <!-- QR Blocks -->
      <g fill="#0b1117" transform="translate(10, 10)">
        <rect x="0" y="0" width="24" height="24"/>
        <rect x="4" y="4" width="16" height="16" fill="#fff"/>
        <rect x="8" y="8" width="8" height="8"/>

        <rect x="56" y="0" width="24" height="24"/>
        <rect x="60" y="4" width="16" height="16" fill="#fff"/>
        <rect x="64" y="8" width="8" height="8"/>

        <rect x="0" y="56" width="24" height="24"/>
        <rect x="4" y="60" width="16" height="16" fill="#fff"/>
        <rect x="8" y="64" width="8" height="8"/>

        <rect x="30" y="10" width="10" height="10"/>
        <rect x="42" y="30" width="16" height="16"/>
        <rect x="30" y="50" width="12" height="12"/>
        <rect x="50" y="60" width="14" height="14"/>
      </g>
    </g>
  </g>
</svg>