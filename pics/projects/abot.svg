<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Abot AI Assistant Interface Preview">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(52,211,153,0.18)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0.06)"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg-grad)"/>

  <!-- Left Sidebar / Sessions -->
  <rect x="24" y="24" width="140" height="352" rx="14" fill="#131e2b" stroke="rgba(240,244,247,0.12)" stroke-width="1"/>
  <rect x="38" y="42" width="112" height="28" rx="8" fill="url(#accent-grad)"/>
  <text x="56" y="60" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#0b1117">+ New Chat</text>
  
  <rect x="38" y="86" width="112" height="24" rx="6" fill="#1e2d3e"/>
  <text x="46" y="102" font-family="'Geist Sans',sans-serif" font-size="10" font-weight="600" fill="#f0f4f7">Data Cleaning...</text>
  <rect x="38" y="118" width="112" height="24" rx="6" fill="transparent"/>
  <text x="46" y="134" font-family="'Geist Sans',sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Model Evaluation</text>
  <rect x="38" y="150" width="112" height="24" rx="6" fill="transparent"/>
  <text x="46" y="166" font-family="'Geist Sans',sans-serif" font-size="10" font-weight="500" fill="#94a3b8">SQL Analysis</text>

  <!-- Main Chat Area -->
  <rect x="176" y="24" width="440" height="352" rx="14" fill="#132232" stroke="rgba(240,244,247,0.12)" stroke-width="1"/>

  <!-- Top Model Selector -->
  <rect x="192" y="38" width="88" height="24" rx="6" fill="#1e2f42" stroke="rgba(52,211,153,0.3)"/>
  <circle cx="204" cy="50" r="4" fill="#34d399"/>
  <text x="214" y="54" font-family="'Geist Mono',monospace" font-size="9" font-weight="700" fill="#34d399">Gemini 1.5</text>

  <rect x="286" y="38" width="84" height="24" rx="6" fill="#1a2736"/>
  <text x="298" y="54" font-family="'Geist Mono',monospace" font-size="9" font-weight="500" fill="#94a3b8">Claude 3.5</text>

  <!-- User Message Bubble -->
  <g transform="translate(310, 78)">
    <rect width="290" height="42" rx="12" fill="#1c2d3f" stroke="rgba(240,244,247,0.14)"/>
    <text x="14" y="25" font-family="'Geist Sans',sans-serif" font-size="11" fill="#f0f4f7">Compare accuracy on regression dataset</text>
  </g>

  <!-- Assistant Response Bubble with Comparison -->
  <g transform="translate(192, 134)">
    <rect width="408" height="150" rx="12" fill="url(#ai-grad)" stroke="rgba(52,211,153,0.35)"/>
    <circle cx="20" cy="22" r="8" fill="url(#accent-grad)"/>
    <text x="16" y="26" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="900" fill="#0b1117">A</text>
    <text x="36" y="26" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#34d399">Abot Response Comparison</text>
    
    <!-- Comparison metric cards -->
    <rect x="14" y="42" width="184" height="60" rx="8" fill="#0b1117" stroke="rgba(240,244,247,0.12)"/>
    <text x="24" y="58" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">PROVIDER A (Gemini)</text>
    <text x="24" y="78" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#f0f4f7">R²: 0.88 · Latency: 180ms</text>
    <text x="24" y="92" font-family="'Geist Sans',sans-serif" font-size="9" fill="#34d399">✓ Recommended pipeline</text>

    <rect x="210" y="42" width="184" height="60" rx="8" fill="#0b1117" stroke="rgba(240,244,247,0.12)"/>
    <text x="220" y="58" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">PROVIDER B</text>
    <text x="220" y="78" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#f0f4f7">R²: 0.84 · Latency: 420ms</text>
    <text x="220" y="92" font-family="'Geist Sans',sans-serif" font-size="9" fill="#94a3b8">Baseline fallback</text>

    <text x="14" y="126" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">State: persistent · Firestore synced</text>
  </g>

  <!-- Prompt Input Bar -->
  <g transform="translate(192, 300)">
    <rect width="408" height="48" rx="10" fill="#0b1117" stroke="rgba(52,211,153,0.4)"/>
    <text x="16" y="28" font-family="'Geist Sans',sans-serif" font-size="11" fill="#94a3b8">Ask anything or evaluate dataset outputs...</text>
    <rect x="364" y="8" width="32" height="32" rx="8" fill="url(#accent-grad)"/>
    <polygon points="378,20 388,24 378,28" fill="#0b1117"/>
  </g>
</svg>