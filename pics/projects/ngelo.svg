<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="N-Gelo E-Commerce Storefront Preview">
  <defs>
    <linearGradient id="ngelo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="ngelo-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#ngelo-bg)"/>

  <!-- Main Storefront App Window -->
  <rect x="36" y="24" width="568" height="352" rx="14" fill="#132232" stroke="rgba(240,244,247,0.12)" stroke-width="1"/>

  <!-- Header Nav -->
  <text x="60" y="58" font-family="'Space Grotesk',sans-serif" font-size="18" font-weight="700" fill="#f0f4f7">N-Gelo <tspan fill="#34d399">Storefront</tspan></text>
  <text x="60" y="76" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">Vue.js 3 · Vite · Reactive State · Dynamic Shopping Cart</text>

  <!-- Cart Pill Badge -->
  <rect x="490" y="42" width="90" height="26" rx="13" fill="#0b1117" stroke="rgba(52,211,153,0.4)" stroke-width="1"/>
  <text x="510" y="59" font-family="'Geist Mono',monospace" font-size="10" font-weight="700" fill="#34d399">Cart (3)</text>

  <!-- Product 1 -->
  <g transform="translate(60, 96)">
    <rect width="156" height="190" rx="10" fill="#0b1117" stroke="rgba(240,244,247,0.14)"/>
    <rect x="12" y="12" width="132" height="74" rx="6" fill="#1c2d3f"/>
    <circle cx="78" cy="49" r="16" fill="url(#ngelo-accent)"/>
    <text x="70" y="54" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="900" fill="#0b1117">APP</text>
    <text x="14" y="108" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#f0f4f7">Modern Sneaker</text>
    <text x="14" y="124" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">Apparel · In Stock</text>
    <text x="14" y="152" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" fill="#34d399">$120</text>
    <rect x="90" y="136" width="54" height="24" rx="6" fill="url(#ngelo-accent)"/>
    <text x="99" y="152" font-family="'Geist Sans',sans-serif" font-size="9" font-weight="700" fill="#0b1117">+ Cart</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(242, 96)">
    <rect width="156" height="190" rx="10" fill="#0b1117" stroke="rgba(52,211,153,0.35)"/>
    <rect x="12" y="12" width="132" height="74" rx="6" fill="#1c2d3f"/>
    <circle cx="78" cy="49" r="16" fill="url(#ngelo-accent)"/>
    <text x="70" y="54" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="900" fill="#0b1117">TECH</text>
    <text x="14" y="108" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#f0f4f7">Smart Watch Pro</text>
    <text x="14" y="124" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">Wearables · Fast Ship</text>
    <text x="14" y="152" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" fill="#34d399">$299</text>
    <rect x="90" y="136" width="54" height="24" rx="6" fill="url(#ngelo-accent)"/>
    <text x="99" y="152" font-family="'Geist Sans',sans-serif" font-size="9" font-weight="700" fill="#0b1117">+ Cart</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(424, 96)">
    <rect width="156" height="190" rx="10" fill="#0b1117" stroke="rgba(240,244,247,0.14)"/>
    <rect x="12" y="12" width="132" height="74" rx="6" fill="#1c2d3f"/>
    <circle cx="78" cy="49" r="16" fill="url(#ngelo-accent)"/>
    <text x="71" y="54" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="900" fill="#0b1117">AUD</text>
    <text x="14" y="108" font-family="'Geist Sans',sans-serif" font-size="11" font-weight="700" fill="#f0f4f7">Wireless Audio</text>
    <text x="14" y="124" font-family="'Geist Mono',monospace" font-size="9" fill="#94a3b8">Audio · Bluetooth 5.3</text>
    <text x="14" y="152" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" fill="#34d399">$89</text>
    <rect x="90" y="136" width="54" height="24" rx="6" fill="url(#ngelo-accent)"/>
    <text x="99" y="152" font-family="'Geist Sans',sans-serif" font-size="9" font-weight="700" fill="#0b1117">+ Cart</text>
  </g>

  <!-- Checkout Footer Bar -->
  <rect x="60" y="304" width="520" height="46" rx="8" fill="#0b1117" stroke="rgba(240,244,247,0.08)"/>
  <text x="78" y="332" font-family="'Geist Mono',monospace" font-size="10" fill="#94a3b8">3 Items Selected · Subtotal: <tspan fill="#f0f4f7" font-weight="700">$508.00</tspan></text>
  <rect x="440" y="312" width="124" height="30" rx="6" fill="url(#ngelo-accent)"/>
  <text x="460" y="331" font-family="'Geist Sans',sans-serif" font-size="10" font-weight="700" fill="#0b1117">Checkout →</text>
</svg>