<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page not found — Basith AbuSyed</title>
    <meta name="description" content="This page does not exist. Return to Basith AbuSyed's portfolio.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◍</text></svg>">
    <style>
        :root {
            color-scheme: dark;
            --bg: #090e14;
            --surface: rgba(15, 25, 36, 0.78);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #10b981;
            --accent-strong: #059669;
            --line: rgba(241, 245, 249, 0.12);
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #f8fafc;
                --surface: rgba(255, 255, 255, 0.92);
                --text: #0f172a;
                --muted: #475569;
                --accent: #059669;
                --accent-strong: #047857;
                --line: rgba(15, 23, 42, 0.12);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: "Space Grotesk", "Geist Sans", system-ui, sans-serif;
        }
        .nf-card {
            max-width: 34rem;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--surface);
            padding: 3rem 2.5rem;
        }
        .nf-code {
            font-family: "Geist Mono", Consolas, monospace;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .nf-title {
            font-size: clamp(3.5rem, 10vw, 5.5rem);
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0.75rem 0;
        }
        .nf-copy { color: var(--muted); line-height: 1.6; }
        .nf-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 2rem;
        }
        .nf-actions a {
            border-radius: 999px;
            padding: 0.7rem 1.4rem;
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            transition: transform 180ms ease;
        }
        .nf-actions a:active { transform: scale(0.98); }
        .nf-primary { background: var(--accent); color: #fff; }
        .nf-ghost { border: 1px solid var(--line); color: var(--text); }
    </style>
</head>
<body>
    <main class="nf-card">
        <p class="nf-code">404 · not found</p>
        <h1 class="nf-title">Lost in the data</h1>
        <p class="nf-copy">This page does not exist or was moved. Head back to the portfolio to keep exploring.</p>
        <div class="nf-actions">
            <a class="nf-primary" href="/">Back home</a>
            <a class="nf-ghost" href="/#work">View projects</a>
            <a class="nf-ghost" href="/#contact">Get in touch</a>
        </div>
    </main>
</body>
</html>
